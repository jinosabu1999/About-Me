<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#181a26"/>
      <stop offset="100%" stop-color="#07080c"/>
    </radialGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#00e5ff" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="506" height="506" x="3" y="3" rx="109" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#neonGlow)" stroke-width="2" opacity="0.3"/>

  <!-- Core Monogram / Icon Symbol: Futuristic 'JS' & Lightning Dynamic Bolt -->
  <g filter="url(#dropGlow)">
    <!-- Stylized Hexagonal / Diamond Shield -->
    <path d="M 256 70 L 410 160 L 410 340 L 256 430 L 102 340 L 102 160 Z" fill="none" stroke="url(#neonGlow)" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Inner Stylized Lightning Bolt / Monogram Core -->
    <path d="M 280 120 L 180 260 L 250 260 L 230 380 L 330 240 L 260 240 Z" fill="url(#neonGlow)"/>
    <!-- High-tech accent dot -->
    <circle cx="370" cy="140" r="14" fill="#10b981"/>
    <circle cx="142" cy="360" r="10" fill="#00e5ff"/>
  </g>
</svg>