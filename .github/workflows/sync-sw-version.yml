# ─────────────────────────────────────────────────────────────────────────────
# SYNC SW VERSION — keeps sw.js in step with index.html, on every push.
#
# Why: sw.js names its precache buckets with CACHE_VERSION. If that string
# does not change, the browser installs no new worker, the old precached
# index.html survives, and a returning visitor can keep an old HTML shell
# while offline. index.html already registers `sw.js?v=<SITE_VERSION>`, which
# forces the file to be re-fetched — this workflow makes sure its bytes
# actually changed, so a new cache is created and the old one is purged.
#
# Single source of truth: window.SITE_VERSION in index.html.
#   bump SITE_VERSION when you ship  ->  CACHE_VERSION follows automatically.
#   You never touch sw.js by hand again.
#
# Loop-safe: the commit step only fires when the value really changed, so the
# push it makes cannot trigger another commit. The paths filter also keeps it
# away from the feed-refresh commits.
# ─────────────────────────────────────────────────────────────────────────────
name: Sync sw version

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
  workflow_dispatch:            # plus a manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: sync-sw-version
  cancel-in-progress: false     # queue, never cancel mid-push

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0         # full history, so we can diff the push

      - name: Read SITE_VERSION from index.html
        id: ver
        run: |
          set -e
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re, sys
          html = open("index.html", encoding="utf-8").read()
          m = re.search(r"SITE_VERSION\s*=\s*'([^']+)'", html)
          if not m:
              print("::error::Could not find SITE_VERSION in index.html")
              sys.exit(1)
          version = m.group(1)
          if not re.fullmatch(r"v\d+(\.\d+)*", version):
              print(f"::error::SITE_VERSION does not look like a version: {version!r}")
              sys.exit(1)
          print(f"version={version}")
          PY

      - name: Write CACHE_VERSION into sw.js
        run: |
          set -e
          python3 - <<'PY'
          import re, sys
          version = "${{ steps.ver.outputs.version }}"
          src = open("sw.js", encoding="utf-8").read()
          m = re.search(r"const\s+CACHE_VERSION\s*=\s*'([^']*)'\s*;", src)
          if not m:
              print("::error::Could not find CACHE_VERSION in sw.js")
              sys.exit(1)
          if m.group(1) == version:
              print(f"CACHE_VERSION already {version} - nothing to write.")
          else:
              new = src[:m.start()] + f"const CACHE_VERSION = '{version}';" + src[m.end():]
              open("sw.js", "w", encoding="utf-8").write(new)
              print(f"CACHE_VERSION {m.group(1)} -> {version}")
          PY

      - name: Warn if index.html changed without a version bump
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -e
          python3 - <<'PY'
          import os, re, subprocess, sys
          def ver(text):
              m = re.search(r"SITE_VERSION\s*=\s*'([^']+)'", text)
              return m.group(1) if m else None
          before = os.environ.get("BEFORE_SHA", "")
          if not before or before == "0000000000000000000000000000000000000000":
              print("No previous revision to compare against - skipping the check.")
              sys.exit(0)
          try:
              old = subprocess.run(["git", "show", f"{before}:index.html"],
                                   capture_output=True, text=True, check=True).stdout
          except Exception:
              print("Could not read the previous index.html - skipping the check.")
              sys.exit(0)
          cur = ver(open("index.html", encoding="utf-8").read())
          prev = ver(old)
          if not cur or not prev:
              sys.exit(0)
          if cur == prev:
              print(f"::warning::index.html changed but SITE_VERSION is still {cur}. "
                    "The offline precache keeps the old HTML shell until the version is bumped. "
                    "Bump SITE_VERSION in index.html when you ship.")
          else:
              print(f"SITE_VERSION {prev} -> {cur} - precache will be refreshed.")
          PY

      - name: Commit if changed
        run: |
          set -e
          git config user.name  "sw-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sw.js
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore(sw): sync CACHE_VERSION to ${{ steps.ver.outputs.version }}"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push origin "HEAD:${{ github.ref_name }}"
          fi
